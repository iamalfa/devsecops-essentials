version: '3.8'

services:
  web-app:
    image: ghcr.io/iamalfa/devsecops-custom-app:latest
    container_name: devsecops-custom-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - observability-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - observability-net

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped
    ports:
      - "9115:9115"
    networks:
      - observability-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - observability-net
    depends_on:
      - web-app
      - node-exporter
      - blackbox-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - observability-net
    depends_on:
      - prometheus

networks:
  observability-net:
    driver: bridge
