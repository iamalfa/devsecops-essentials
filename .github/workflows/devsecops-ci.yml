name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  static-security-audit:
    name: SAST & Secret Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ShellCheck on Automation Scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './bash-automation'

      - name: Run Fast Semgrep SAST Audit
        run: |
          pip install semgrep
          semgrep scan --config "p/ci" --severity ERROR --error

  container-security-audit:
    name: Container Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: static-security-audit

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Static Config Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hardened Container Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/devsecops-custom-app:${{ github.sha }} ./my-custom-app

      - name: Run Trivy Image Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/devsecops-custom-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Hardened Image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ghcr.io/${{ github.repository_owner }}/devsecops-custom-app:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/devsecops-custom-app:latest
          docker push ghcr.io/${{ github.repository_owner }}/devsecops-custom-app:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/devsecops-custom-app:latest

  staging-smoke-test:
    name: Staging Deployment & Smoke Test
    runs-on: ubuntu-latest
    needs: container-security-audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Container to Mock Staging
        run: |
          echo "Pulling freshly verified image..."
          docker pull ghcr.io/${{ github.repository_owner }}/devsecops-custom-app:${{ github.sha }}
          
          echo "Starting hardened non-root container on port 8080..."
          docker run -d --name staging-app -p 8080:8080 ghcr.io/${{ github.repository_owner }}/devsecops-custom-app:${{ github.sha }}
          
          # Container ko initialize hone ke liye 5 seconds wait karein
          sleep 5

      - name: Execute Automated Smoke & Health Check
        run: |
          echo "Running health probe against staging endpoint..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080)
          
          echo "Received HTTP Status Code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Smoke Test Passed! Web application is healthy and serving requests on hardened port 8080."
          else
            echo "Smoke Test Failed! Expected HTTP 200 but received $HTTP_STATUS"
            docker logs staging-app
            exit 1
          fi

      - name: Tear Down Staging Container
        if: always()
        run: |
          docker stop staging-app || true
          docker rm staging-app || true
