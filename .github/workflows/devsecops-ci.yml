name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  static-security-audit:
    name: SAST & Secret Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ShellCheck on Automation Scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './bash-automation'

      - name: Run Semgrep SAST Audit
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets

  container-security-audit:
    name: Container Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: static-security-audit

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Static Config Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hardened Container Image
        run: |
          docker build -t devsecops-custom-app:${{ github.sha }} ./my-custom-app

      - name: Run Trivy Image Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-custom-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
